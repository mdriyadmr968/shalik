# Shalik Gemma 3n LoRA Fine-Tuning Configuration (Milestone M4)

model:
  base_model_name_or_path: "google/gemma-3n-e2b-it"
  torch_dtype: "bfloat16"
  max_seq_length: 1024

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "ml/finetune/checkpoints/gemma3n_shalik_lora"
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  num_train_epochs: 3
  logging_steps: 10
  save_strategy: "epoch"
  seed: 42
  fp16: false
  bf16: true
  general_bangla_preservation_ratio: 0.15 # 15% general Bengali instruction mix to prevent catastrophic forgetting

dataset:
  train_data_path: "data/processed/shalik_sft_conversations.jsonl"
  val_split_ratio: 0.1
