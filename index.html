<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Shalik (শালিক) — Offline Farm Assistant</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #ECEFF1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Kalpurush", "SolaimanLipi", sans-serif;
      }
      #root {
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .mobile-frame {
        width: 100%;
        max-width: 440px;
        height: 100%;
        max-height: 900px;
        background: #F9FBE7;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      @media (max-width: 480px) {
        .mobile-frame {
          max-width: 100%;
          max-height: 100%;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.web.tsx"></script>
  </body>
</html>
